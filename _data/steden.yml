# Voorlopige lijst met voorbeeldsteden (lanceringssteden staan nog open).
# De korte regels zijn voorlopig en worden later aangepast.
# Het veld regio is de volledige naam van het Zweedse län (zoiets als een provincie),
# bijvoorbeeld "Skåne län". Let op: Stockholms, Västra Götalands en Östergötlands län krijgen een s.
# Volgorde: eerst de regio's in het Zweeds alfabet (å, ä en ö na de z),
# daarbinnen de steden alfabetisch. De pagina Alle steden volgt deze volgorde.
# Optioneel: zoekwoorden (andere spellingen), alleen voor de zoekfunctie.
# Optioneel: foto (zie Helsingborg en Uppsala), met fotomaker, fotolicentie,
# fotolicentie_url (link naar de licentietekst) en fotobron_url (link naar de bronpagina).
# Optioneel: fotowijziging (wat er aan de foto is veranderd; standaard "bijgesneden").
# Optioneel: herofoto (een andere uitsnede van de foto voor de uitgelichte foto bovenaan de homepage).
# Optioneel: herofotopositie (welk deel van de foto in de hero zichtbaar blijft als hij wordt bijgesneden, bijvoorbeeld "5% 50%"; standaard het midden).
# Een eigen foto heeft alleen het veld foto: het bijschrift wordt dan "Foto: Verrassend Zweden".
